[project]
name = "wave-consensus"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "numpy>=2.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Archived one-off run scripts are records, not maintained code.
exclude = ["cutoff-probe/runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
