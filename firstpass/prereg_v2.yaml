generation:
  cell: cross_family_diverse_role only (no E0 factorial in v2)
  roles: latin_square(cross_family key order, [forward, backward, skeptic], v2 item index)
  seed: 1
  temperature: 0.7
  max_tokens: 3000
  preflight: 'run_generate_v2 must verify before ANY network call: panelB resolves exactly
    234 reused cache hits and 216 new calls; panelA resolves 0 reused and 450 new calls. Any
    deviation aborts.'
  quota_cap:
    panelB:
      planned_new_calls: 216
      cap_with_retry_allowance: 260
      backend_mix: openrouter 216
    panelA:
      planned_new_calls: 450
      cap_with_retry_allowance: 540
      backend_mix: local 150 (unmetered) + openrouter 150 + hoonify 150
    openrouter_daily_check: planned openrouter total 366 (+20% = 440) vs measured 1000/day
      allowance
    rule: abort the panel when CUMULATIVE attempted calls (persisted in out/attempts_v2_<panel>.json
      across re-runs) would exceed its cap
E1_v2:
  primary:
    metric: held-out item-stratified delta log-loss, WCT-EM vs covariate baseline
    delta: 0.02
    calibration_map: 'Platt: sigmoid(a*s + b), a>0, fitted on the calibration split by exact
      ML (L-BFGS on the NLL, score standardised by calib sd during fitting), exactly the frozen
      implementation in exp/recalib.py fit_platt_map. Applied to every score arm identically.
      This registers the intercept the v1 map lacked; v1 temperature calibration is reported
      as an ablation.'
    baseline: 'same covariate logistic as v1 (qdep, n_emitting, n_claims, text_len/50; fit_logistic
      400 iters lr 0.1 l2 1.0). REGISTERED SENSITIVITY: the exact-ML refit of the same baseline
      is reported alongside; the primary verdict is stated against the v1-style fit, and any
      verdict difference between the two baselines is reported, not resolved.'
    interval: item-block bootstrap, 2000 resamples, seed 20260807, 95%
    decision_rule: protocol 1.1 three-way at delta
  co_primary:
    metric: precision@k, k = number of test propositions affirmed by >=2 agents
    comparator: WCT-EM (Platt-calibrated) precision@k MINUS covariate baseline (gd fit) precision@k,
      k and both precisions recomputed inside every resample
    interval: item-block bootstrap, 2000 resamples, seed 20260807, 95%
    delta: 0.05
    decision_rule: protocol 1.1 three-way at delta, computed in exp/e1_v2.py run_arms
  arms:
  - WCT-EM (primary)
  - WCT-U
  - WCT-C
  - covariate_baseline (gd + exact-ML sensitivity)
  - prevalence_only (constant; no calibration map)
  - uncapped M6 ablation (Platt by the same ML procedure; slope sign UNCONSTRAINED — the ablation
    registers signal absence, so a ~zero or negative slope is its expected result, not a fit
    failure)
  registered_instrument_variants:
