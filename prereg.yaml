split:
  algorithm: >-
    ids = the 30 article ids sorted lexicographically;
    python random.Random(42).shuffle(ids); the first 10 are train,
    the next 10 calibration, the last 10 test. Article-level; no
    proposition of a seen article appears in an unseen role.
  seed: 42
  train: ["T24", "T19", "T15", "T32", "T27", "T10", "T08", "T17", "T16", "T20"]
  calibration: ["T14", "T30", "T36", "T26", "T21", "T34", "T02", "T18", "T23", "T03"]
  test: ["T22", "T35", "T05", "T29", "T12", "T13", "T28", "T01", "T04", "T25"]
  census:
    non_entail_test: 201
    threshold: 60
    result: PASS

solver:
  model: qwen3.8-27b (community merge, Gated DeltaNet hybrid)
  host: marzuki-hydrogen, vLLM, port 8000
  fine_tuned: false
  temperature: 0
  thinking: off (chat_template_kwargs enable_thinking false)

jury:
  rule: >-
    Five base models from five distinct organizations, each below 4B,
    documented training cutoff before 2026-08-14; where documentation
    is absent, the frozen probe set (cutoff-probe/probes.md) is the
    eligibility gate (blind to the 2026-08-14..2026-08-25 window).
  members:
    - model: meta-llama/Llama-3.2-1B-Instruct
      org: Meta
      params: 1.23B
      cutoff: 2023-12 (model card)
    - model: google/gemma-3-1b-it
      org: Google
      params: 1.0B
      cutoff: 2024-08 (model card)
    - model: microsoft/Phi-4-mini-instruct
      org: Microsoft
      params: 3.8B
      cutoff: 2024-06 (model card)
    - model: allenai/OLMoE-1B-7B-0125-Instruct
      org: Allen AI
      params: 1.3B active / 6.9B total (MoE)
      cutoff: undocumented; probed, window-blind, eligible
    - model: Qwen/Qwen3.5-4B
      org: Alibaba
      params: 4.66B (VLM, Gated DeltaNet hybrid)
      cutoff: undocumented; probed, window-blind, eligible
  same_family_arm: >-
    Qwen3.5-4B shares the solver's family (Qwen3.8-27B). Registered
    as a contrast arm for the family-blind-spot mechanism, not a
    confound. The prereg report must show 5-juror consensus and
    4-external leave-one-out side by side, plus arm-level per-class
    analysis; the headline never depends on the arm.
  fallbacks_4b:
    - meta-llama/Llama-3.2-3B-Instruct (cutoff 2023-12)
    - google/gemma-3-4b-it (cutoff 2024-08)
  fallback_rule: >-
    Primary below 75 percent on the calibration set is replaced by its
    same-family 4B-class sibling; families without a 4B sibling (Phi,
    OLMoE, Qwen) take a registered cross-family fill from the 4B-class
    candidates. Declared here, applied family-by-family, labelled in
    the report.

prompts:  # verbatim frozen user-message templates (no system message)
  jury_contract: |
    You are a careful fact-checker. A claim about the news article below is
    stated in question form. Verify the claim against the article. Your verdict
    must rest solely on the article: no outside knowledge, no prior beliefs, no
    plausibility.
    
    Rules:
    - PASS if the article states the claim or directly entails it.
    - FAIL if the article states the opposite or gives a conflicting fact.
    - NOT_STATED if the article does not contain the information the question
      asks about.
    
    Reply with a single JSON object and nothing else:
    {"answer": "PASS" | "FAIL" | "NOT_STATED", "reason": "<one or two sentences
    grounding the verdict in the article>"}
    
    <article>
    {article text, verbatim from corpus/articles/T##.md}
    </article>
    
    Answer this question only based on the information available on this
    article.
    
    {claim in question form, verbatim from corpus/pool/question_form/T##.md}
  solver_baseline: |
    Below is a news article, followed by 20 questions about it.
    
    <article>
    {article text, verbatim from corpus/articles/T##.md}
    </article>
    
    Answer each question in order.
    
    1. {question 1, verbatim from corpus/questions/T##.md}
    2. {question 2}
    ...
    20. {question 20}
  parameters: {temperature: 0, max_tokens: 512, thinking: off}
  question_form_rule: >-
    "Is it true that {proposition text, verbatim, without trailing
    period}?" applied to all 1200 pool propositions; negations
    preserved as-is. Renderings in corpus/pool/question_form/,
    content-hashed above.

contract:
  answers: [PASS, FAIL, NOT_STATED]
  mapping: {PASS: ENTAIL, FAIL: CONTRADICT, NOT_STATED: UNSPECIFIED}
  gate_binary: PASS vs not-PASS (ENTAIL vs non-ENTAIL)
  calls: one call per claim (40 per article per proposer)
  parse: strict JSON; failures are missing observations, never coerced;
    parse rate reported per proposer

arms:
  primary: WCT-EM (three-state Dawid-Skene, unsupervised)
  secondary: WCT-U (uniform signed support)
  ablations:
    - claim_instance_counting (verbosity-weighted; expected to fail)
    - single_best_proposer_calibrated (oracle reference)
  floor: base_rate

baselines_in_order_of_stringency:
  1: trivial base rate (floor)
  2: single best proposer, calibrated (oracle reference)
  3: zero-shot 1-4B jury native outputs on the same task (P4 arm)
  4: frontier self-review (27B with the frozen jury contract on the
     same claims; the null control the pass criterion compares against)
  5: covariate logistic regression (the registered bar)
  6: optional small supervised verifier trained on calibration labels

covariate_baseline:
  features: [article_length, pool_position, claim_length, polarity,
             question_type]
  fitted_on: calibration split only
  note: model-free; the feature list is pinned here, not chosen after
        seeing results

metrics:
  primary: >-
    Held-out article-block delta log-loss, WCT-EM vs the covariate
    baseline, delta threshold 0.02 nats, article-block bootstrap,
    2000 resamples.
  co_primary: within-article AUROC, WCT-EM vs ranked covariate baseline
  null: within-article truth permutations, 10000 permutations
  e0: pairwise proposition-level residual error correlation across
      voters, reported as a number
  calibration: Platt sigmoid(a*s+b), exact MLE on calibration split;
                temperature kept as an ablation
  solver_value: flag precision, flag recall, claim accuracy change
                solver-alone vs solver-plus-jury (low-consensus claims
                dropped); solver confidence = mean token probability
                of the answer span
  cost: per arm, total input/output tokens, GPU-seconds, USD, median
        TTFT, minimum hardware at target concurrency
  jury_size_sweep: gated false-claim rate at sizes 1/3/5; the 3-juror
        arm is the three highest-calibration-accuracy families
        (pre-specified); descriptive curve

pass_criterion: >-
    Across the test articles, the juror-gated system (defendant claims
    gated by jury consensus, below-4B primary with the registered 4B
    fallback where applied) PASSES if (a) it outperforms the frontier
    self-review control on false-claim rate with the 95 percent
    bootstrap CI of the difference entirely below zero, OR (b) it is
    comparable within 10 percentage points of false-claim rate (point
    estimate, bootstrap CI reported) at strictly lower total compute
    cost (USD, amortized serving price). The cost ratio is a headline
    number; the pass branch requires strictly lower cost, not a fixed
    ratio.
decision_rule: >-
    GO requires the point estimate at or above delta AND the bootstrap
    interval excluding zero. Point clears delta but the bound does
    not: INCONCLUSIVE. Degenerate (zero-width) intervals are reported,
    never silently interpreted.

predictions:
  P1: WCT-EM primary returns GO on the fine-tuned jury.
  P2: Leave-one-proposer-out primary remains GO with each voter
      removed in turn (including the solver-as-proposer, consensus
      not oracle).
  P3: Claim-instance counting AUROC below 0.65 on the test split
      (one-vote-per-source invariant holds).
  P4: Delta log-loss advantage over base rate on the fine-tuned jury
      is at least as large as the zero-shot 4B jury's advantage on
      the same articles.
  P5: The jury consensus flags a strictly larger share of the solver's
      non-ENTAIL claims than of its ENTAIL claims on test articles.
      (power note) needs at least 100 pool-matched solver claims of
      each class, else descriptive only.
  P6: (co-designer's, verbatim intent) On test articles, over the
      solver's pool-matched claims on UNSPECIFIED propositions,
      (a) the solver bullshits a confident answer on at least 50
      percent of them, and (b) the jury-consensus gate removes at
      least half of those wrong answers (false-answer rate drops
      from at least 50 percent to under 33 percent). (power note)
      needs at least 30 such claims, else descriptive only.
  P7: (a) The 5-juror consensus outperforms the single best juror on
      false-claim rate (mechanism, same-family blind spots). (b) The
      juror consensus's raw compute effort exceeds 50 percent of the
      27B's while its false-claim rate is lower than the control's.
      Raw compute effort = aggregate parameter scale x tokens.
      (power note) needs complete token and parameter accounting for
      every arm.

training:
  scheme: >-
    Self-distillation. Before any fine-tuning, each base family runs
    zero-shot on its own training slice under the jury contract and
    its exact native output is captured. Target = {answer: PASS|FAIL
    parsed from the native output, reason: native output verbatim}.
    The LoRA learns only the wrapper (instruction style, JSON
    contract, answer field); reasoning content stays native.
  variants: [reason_included, votes_only]
  adapters: 10 (2 variants x 5 families)
  slices: >-
    Disjoint 10-article training split per family, distinct seeds,
    different recipe where possible, to keep error correlation low.
  losslessness: >-
    Per adapter, base and fine-tuned run on the 10 calibration
    articles (untrained for every family): (a) exact-match agreement
    of outputs, (b) PPL of the base native outputs under the
    fine-tuned model as a ratio to the base self-PPL (1.0 lossless).
    Descriptive, per family; divergent adapters are flagged
    perturbed and their consensus share reported separately.

contamination_check: >-
    For every test article, each base juror answers the 20 seed
    questions WITHOUT the article (parametric only) and WITH it,
    before any fine-tuned output exists. Any question answered above
    chance without the article is flagged parametric; flags are logged
    before the fine-tuned test run is seen.

spend_caps:  # hard cumulative per-model call caps, persisted across
             # re-runs (runner maintains the counters)
  qwen3_8_27b: 5000
  each_juror_model: 5000

discipline:
  - Implementations are the registration. The committed files at the
    tag are the record, not this prose.
  - The decision-rule boundary clause (metrics.decision_rule) is the
    C11 fix; it is explicit, not implied.
  - Generation cache is content-hashed and immutable; analysis re-runs
    at zero inference cost.
  - DECISIONS.md and GOTCHAS.md are part of the record.
