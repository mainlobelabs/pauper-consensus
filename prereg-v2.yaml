gate:  # per-topic contamination gate (registered exclusion rule)
  rule: >-
    Any topic where a panel model shows in-window knowledge is dropped,
    before any jury or fine-tuned output exists.
  host: marzuki-helium (omlx, ports 8102-8107)
  panel: 7 base models (the documented below-4B panel)
  run: corpus-v2/gate/runs/2026-08-28/
  probes: 1405 (per-topic, ~5 probes/topic) + 14 canary slots
  canaries: GC1/GC2 both PASS on all 7 models (no model flagged)
  anchors: 241 probes marked pre-2026 stable knowledge (excluded from drop
    scoring); 10 defective probes rewritten and rerun
  overrides: 33 row-level review overrides to WRONG (gate_review.jsonl)
  result: >-
    72/251 primary topics contaminated and dropped; 179 primaries survive
    (floor 160 met, zero reserves needed for the floor). 9/30 reserves
    contaminated (R01 R04 R05 R06 R08 R10 R13 R16 R26), 21 clean reserves
    used. Final corpus = 179 primaries + 21 reserves = 200 articles.

metadata:  # corpus-v2/pool/metadata.json, derived BEFORE the tag
  rule: >-
    Mechanical, registered (tools/corpus_v2/make_metadata.py). Per
    proposition: fact_role = "silence" iff label is UNSPECIFIED else
    "direct_fact". polarity = "negative" iff a claim-negation token matches
    the registered negation list (double-quoted-title and Norway/
    Norwegian/nor'easter exclusions applied) else "affirmative". trap_type,
    in priority order: "disputed_pin" if the prop id is in the registered
    V2-020 disputed-toll set (8 props); else "unit_swap" if label is
    CONTRADICT and the proposition number is a unit/digit variant of the
    article's number (x10^k, same-length hamming-1, transposition, digit
    drop, decimal move, or same number with a different adjacent unit word);
    else "figure_conflict" if label is UNSPECIFIED and the proposition pins
    a month/day, month/year, >=2-digit number, or "exactly N" absent from
    the article; else "none".
  backtest: >-
    Calibrated against the curated v1 metadata (corpus/pool/metadata.json,
    tag prereg-waveconsensus-v1) BEFORE being applied to v2: trap_type
    91.8 percent agreement, polarity 98.7 percent, derived unit_swap count
    matches v1 curation exactly (82). Residual gaps are v1 curation noise.
  distribution:
    polarity: {affirmative: 7842, negative: 158}   # 98.0 / 2.0 percent
    trap_type: {none: 7334, unit_swap: 429, figure_conflict: 229, disputed_pin: 8}
    fact_role: {direct_fact: 6000, silence: 2000}
  polarity_note: >-
    v2 negative base rate is 2.0 percent (158/8000) versus v1 18.5
    percent. Registered here because the content-only bar's polarity
    feature is near-constant on v2; the bars are frozen v1 fits, so this
    shifts the bar's operating point, not its parameters.

split:
  algorithm: >-
    All 200 v2 articles are the test split. There is no v2 training or
    calibration split: the v1 LoRA adapters are frozen (no retraining) and
    the v1 bars are frozen fits on the v1 calibration split. The v1
    calibration split is reused ONLY inside the frozen baseline artifacts.
  seed: none (v2)
  test: all 200 article ids in corpus-v2/manifest.json order
  v1_splits_reused:  # frozen inside corpus-v2/frozen/v1_baselines.json
    source: v1 corpus at tag prereg-waveconsensus-v1 (seed 42)
    note: the v1 calibration split (10 articles, 400 items) is the only
      v1 data the v2 eval touches, and only through the frozen fits.

frozen_v1_inputs:
  artifact: corpus-v2/frozen/v1_baselines.json
  sha256: 2d011f2d1339b7b4d238a0aaae485a133a5bec525f6480d3639440a70fed39a8
  generator: tools/corpus_v2/freeze_v1_fits.py (committed at this tag)
  contents:
    - per-arm calibration maps (3-class affine on WCT-EM log-posteriors,
      Nelder-Mead MLE, fit on the v1 calibration split), for the three arms
      ft_reason_included, ft_votes_only, base_zeroshot
    - covariate_full (5-feature multinomial logistic fit on the v1
      calibration split) = the registered v1 bar, continuity reference
    - covariate_content (4-feature content-only multinomial logistic fit on
      the v1 calibration split) = the v2 PRIMARY bar
    - em_spec / calibration_spec / covariate_spec (exact hyperparameters)
    - splits_v1 (the v1 train/calibration/test id lists)
    - verification_v1_test (reproduced v1 test-split numbers; the P9
      reference and the eval smoke-test target)
  v1_inputs:
    corpus: corpus/ (tag prereg-waveconsensus-v1, frozen 2026-08-26)
    native_votes:
      base: cutoff-probe/runs/2026-08-26-phase3/native
      finetuned: cutoff-probe/runs/2026-08-27-phase4/finetuned/native

jury:
  models: 12 (4 base families + 8 fine-tuned adapters)
  families:
    - llama-3.2-3b-instruct
    - gemma-3-4b-it
    - phi-4-mini-instruct
    - qwen35-4b
  arms:
    core_headline: >-
      4 base zero-shot + 4 reason_included fine-tuned = 8 models x 200 x 40
      = 64,000 calls (the headline)
    secondary: 4 votes_only fine-tuned = 4 models x 200 x 40 = 32,000 calls
  total_calls: 96000 (200 articles x 40 items x 12 models)
  adapters: >-
    The v1 LoRA adapters (rank 8, scale 20, 200 iters), frozen at
    prereg-waveconsensus-v1 / commit 1273339. Fused weights on helium
    (/Volumes/nvme0/models, 28G). No retraining.
  host: marzuki-helium (100.83.162.43), omlx, ports 8102-8107
  run: >-
    Sequential, core-first (an interrupted run still has the 4 base + 4
    reason_included arms complete), resumable (completed rows skipped).
    Model-to-port mapping is written at launch time (once instances are
    confirmed up) and recorded in the run manifest.
  runner: tools/corpus_v2/jury_run.py (frozen at this tag)
  parameters: {temperature: 0, max_tokens: 512, thinking: "off (qwen35-4b chat_template_kwargs enable_thinking false)", retries: 3, timeout_s: 300}
  max_tokens_note: >-
    512 is the frozen contract value (v1 prereg prompts.parameters). The
    "64" in older notes was the gate-probe spec, not the jury contract; 64
    would truncate reason_included completions and raise the parse-failure
    rate.

prompts:  # verbatim frozen user-message templates (no system message)
  jury_contract: |
    You are a careful fact-checker. A claim about the news article below is
    stated in question form. Verify the claim against the article. Your verdict
    must rest solely on the article: no outside knowledge, no prior beliefs, no
    plausibility.

    Rules:
    - PASS if the article states the claim or directly entails it.
    - FAIL if the article states the opposite or gives a conflicting fact.
    - NOT_STATED if the article does not contain the information the question
      asks about.

    Reply with a single JSON object and nothing else:
    {"answer": "PASS" | "FAIL" | "NOT_STATED", "reason": "<one or two sentences
    grounding the verdict in the article>"}

    <article>
    {article text, verbatim from corpus-v2/articles/<id>.md}
    </article>

    Answer this question only based on the information available on this
    article.

    {claim in question form, verbatim from corpus-v2/pool/question_form/<id>.md}
  parameters: {temperature: 0, max_tokens: 512, thinking: off}
  question_form_rule: >-
    Rendering is frozen (tools/corpus_v2/make_question_form.py, committed at
    this tag). Per article: a header line "<id> pool, question form (40)", a
    blank line, then 40 numbered lines "N. Is it true that {proposition
    text, verbatim, without trailing period}?" with negations preserved
    as-is, N = 1..40 in pool order. The sent question is the line text with
    the "N. " prefix stripped (jury_run.py). Renderings in
    corpus-v2/pool/question_form/, content-hashed above.

contract:
  answers: [PASS, FAIL, NOT_STATED]
  mapping: {PASS: ENTAIL, FAIL: CONTRADICT, NOT_STATED: UNSPECIFIED}
  gate_binary: PASS vs not-PASS (ENTAIL vs non-ENTAIL)
  calls: one call per claim (40 per article per proposer)
  parse: strict JSON; failures are missing observations, never coerced;
    parse rate reported per proposer; on resume-appended retries the last
    row per (model, article, item) wins

arms:
  primary: WCT-EM (three-state MAP-EM Dawid-Skene, unsupervised)
  secondary: WCT-U (uniform signed support)
  ablations:
    - claim_instance_counting (verbosity-weighted; expected to fail)
    - single_best_proposer_calibrated (oracle reference)
  floor: base_rate
  v2_eval_arms: >-
    The v2 eval (tools/corpus_v2/eval_v2.py) scores ft_reason_included
    (primary/flagship), ft_votes_only (secondary), and base_zeroshot
    (fine-tuned-vs-zero-shot reference). WCT-EM spec is identical to v1
    (kappa 5, 0.8 diagonal, structured basins; restarts=0 inside the
    bootstrap, 5 in the point estimate).

covariate_bars:  # both are FROZEN v1 fits (v1_baselines.json)
  content_only:  # PRIMARY v2 bar
    features: [log1p(article_len), log1p(pool_position-1), log1p(claim_len),
               polarity]
    fitted_on: v1 calibration split (frozen)
    motivation: >-
      The registered v1 5-feature bar contains trap_type, near
      label-deterministic by corpus construction (v1 decomposition: the
      shortcut alone is worth 0.078 nats of the bar's LL; on shortcut items
      the bar beats EM by 0.5 to 1.4 nats per item). A model-free bar that
      reads a deterministic function of the label is an unfair bar; the 4
      content features are the pure model-free content bar.
  full:  # SECONDARY v2 bar (continuity reference, no separate GO)
    features: [log1p(article_len), log1p(pool_position-1), log1p(claim_len),
               polarity, one-hot trap_type]
    fitted_on: v1 calibration split (frozen)

metrics:
  primary: >-
    Calibrated WCT-EM vs the frozen CONTENT-ONLY bar, per-item delta
    log-loss (bar minus EM), over all 200 v2 articles. GO = point estimate
    at or above +0.02 nats AND the 95 percent article-block bootstrap CI
    (2000 resamples, EM refit per resample on votes alone, bars and
    calibration frozen) excludes zero.
  secondary: >-
    Calibrated WCT-EM vs the frozen FULL registered v1 bar. Reported as a
    continuity check, no separate GO; expected INCONCLUSIVE and reported as
    such.
  decision_matrix: >-
    2x2 = {content-only, full bar} x {reason_included, votes_only}, each
    cell with the same pre-registered GO rule. Headline = content-only x
    reason_included. base_zeroshot reported as a reference arm.
  co_primary: within-article macro AUROC (P(PASS) score vs truth==PASS),
    calibrated EM vs bar, per cell
  null: within-article truth permutations, 10000 permutations, fixed
    predictors, headline cell
  e0: pairwise proposition-level residual error correlation across the
    arm's four voters, reported as a number
  calibration: three-class affine (Platt-like) on log-posteriors, FROZEN
    per arm from the v1 calibration split (v1_baselines.json)
  cost: per arm, total input/output tokens, GPU-seconds, USD proxy
  system_level: defendant false-claim rate, gate catch, and the juror-
    gated vs self-review pass criterion (see defendant / self_review)
  predictions:
    P8: headline cell (content-only x reason_included) returns GO.
    P9: per fine-tuned arm, the full-bar delta on v2 is within +/- 0.05
      nats of its v1 estimate (v1 reference from the frozen
      verification_v1_test block; consistency, not a GO).
  fallback: >-
    If the v2 primary is INCONCLUSIVE, report it; no further post-hoc bar
    changes.

decision_rule: >-
  GO requires the point estimate at or above delta AND the bootstrap
  interval excluding zero. Point clears delta but the bound does not:
  INCONCLUSIVE. Degenerate (zero-width) intervals are reported, never
  silently interpreted.

pass_criterion: >-
  v2 primary: the headline cell (content-only x reason_included) PASSES if
  GO per the decision rule. The full-bar cell is a continuity report. The
  system-level juror-gated vs self-review comparison on the defendant
  claims re-runs the v1 pass criterion (branch (a) strictly lower
  false-claim rate, or branch (b) comparable within 10 percentage points at
  strictly lower total compute cost) on the v2 corpus.

eval:
  tool: tools/corpus_v2/eval_v2.py (frozen at this tag)
  rng_streams:
    em: 20260827 (point estimate; restarts=5)
    bootstrap: 20260828 (restarts=0 per resample; the 5 structured basins
      are deterministic on the resampled data, matching v1)
    null: 20260829
  bootstrap: 2000 article-block resamples; per resample the WCT-EM
    posterior is refit on the resampled votes alone (restarts=0), bars and
    calibration maps frozen
  null: 10000 within-article truth permutations, fixed predictors, headline
    cell, one-sided p-value
  missing: strict JSON parse; missing observations are dropped (never
    coerced); last row per (model, article, item) wins on resume retries
  verification: >-
    The tool was smoke-tested on the frozen v1 data (10 v1 test articles,
    v1_baselines.json) and reproduces the reported v1 reference numbers
    exactly (content-only deltas +0.093 ri / +0.097 vo; full-bar deltas
    +0.0151 ri / +0.0191 vo; P9 within 0.05 both arms) before the v2 run.

defendant:  # hydrogen 27B phase (runs AFTER the hard pause on the jury)
  model: qwen3.8-27b (community merge, Gated DeltaNet hybrid)
  host: marzuki-hydrogen, vLLM, port 8000
  parameters: {temperature: 0, max_tokens: 512, thinking: off}
  design: >-
    Option A (Andryo, 2026-08-28): one claim question per article across
    all 200 v2 articles = 200 defendant calls. Symmetric with the
    full-corpus self-review (200 x 40 = 8000). No per-article seed-question
    artifact; the defendant generates claims from the article.
  calls: 200 (defendant) + judge (one per extracted claim, ~<=600)
  prompt: |
    Read the news article below. Based only on the article, list up to 3
    specific factual claims about the article's main subject that you are
    confident are true. Each claim must be a single complete sentence naming
    a specific person, number, date, place, or action. Output a numbered
    list (1. 2. 3.) and nothing else. If the article supports fewer than 3
    distinct claims, list fewer.

    <article>
    {article text, verbatim from corpus-v2/articles/<id>.md}
    </article>
  judge: >-
    qwen3.8-27b with the article context. One call per extracted claim. The
    judge returns whether the claim is supported by the article (stated or
    directly entailed) AND the single pool proposition (1-40, or 0 if none)
    the claim matches most closely. Ground-truth false-claim adjudication
    is the judge's supported flag; the pool tie is for the gating
    comparison.
  judge_prompt: |
    Below are a news article, its 40 candidate propositions (numbered 1 to
    40), and one claim. (1) Is the claim supported by the article? A claim
    is supported if the article states it or directly entails it. (2) Which
    single proposition, 1 to 40, does the claim match most closely, or 0 if
    none? Reply with a single JSON object and nothing else:
    {"supported": true|false, "match_pool": <integer 0-40>, "reason":
    "<one sentence>"}

    <article>
    {article text, verbatim from corpus-v2/articles/<id>.md}
    </article>

    <propositions>
    {the 40 pool propositions for <id>, numbered 1-40, verbatim}
    </propositions>

    Claim: {one defendant claim}
  false_claim_rate: judge-unsupported claims / total extracted claims
    (answer rate and claim-count distribution also reported)
  gate_tie: >-
    Only claims with a non-zero unique pool tie are gateable. A gateable
    claim is RETAINED by an arm if that arm's verdict on the tied pool
    proposition is PASS (jury consensus P(PASS) >= 0.5, or self-review
    PASS). False-claim catch = the share of judge-unsupported claims the
    gate drops.

self_review:  # hydrogen 27B phase
  model: qwen3.8-27b
  host: marzuki-hydrogen, vLLM, port 8000
  parameters: {temperature: 0, max_tokens: 512, thinking: off}
  prompt: the v2 jury_contract template above (identical to the helium
    jury), applied to every pool proposition
  calls: 200 x 40 = 8000 (full corpus)
  outputs: three-state PASS/FAIL/NOT_STATED per pool proposition
  uses:
    - the system bar, i.e. three-state accuracy and gate-binary (PASS)
      accuracy on the v2 pool labels (the frontier self-review control)
    - the self-review gate for the defendant claims (pass_criterion)
  pass_criterion_system: >-
    Juror-gated (defendant claims gated by the 12-model jury consensus on
    the tied pool proposition) vs self-review-gated (same claims gated by
    the 27B self-review PASS). PASSES via branch (a) strictly lower
    false-claim rate with the 95 percent bootstrap CI of the difference
    entirely below zero, OR branch (b) comparable within 10 percentage
    points at strictly lower total compute cost (USD proxy, amortized
    serving).

spend_caps:  # hard cumulative per-model call caps, persisted across re-runs
  qwen3_8_27b: 10000   # defendant ~200 + judge ~600 + self-review 8000
  each_juror_model: 8000   # 200 x 40 per model

discipline:
  - Implementations are the registration. The committed files at the tag
    are the record, not this prose.
  - The decision-rule boundary clause (decision_rule) is explicit, not
    implied.
  - Generation cache is content-hashed and immutable; analysis re-runs at
    zero inference cost.
  - Frozen v1 inputs are consumed only through corpus-v2/frozen/
    v1_baselines.json; no v2 data touches a v1 fit.
  - The v2 jury and the hydrogen 27B phase are separate phases. The jury is
    frozen and launched first; the defendant/self-review prompts are frozen
    here and run after a hard pause to report jury results first.
  - DECISIONS.md and GOTCHAS.md are part of the record.
