# wave-consensus pre-registration v2 (frozen 2026-08-28, tag prereg-waveconsensus-v2)
# Continuation of prereg-waveconsensus-v1 (frozen 2026-08-26). Written BEFORE
# any v2 jury or hydrogen output exists. The implementations ARE the
# registration: the committed corpus-v2/ files, prompts, tools, frozen v1
# artifacts, and this file at git tag prereg-waveconsensus-v2.
tag: prereg-waveconsensus-v2
frozen: 2026-08-28
authors:
  - Andryo Marzuki (design, decisions, approvals; corpus curation; labeler)
  - Jeremiah Mannings (co-designer)
  - Frank (implementation, opencode agent)
repo: github.com/marzukia/wave-consensus (private)
spec: >-
  v2 is a positive-primary continuation on a NEW post-cutoff corpus. The v1
  LoRA adapters and v1 calibration/covariate fits are frozen inputs (no
  retraining); the v2 jury runs 12 models over the 200-article corpus on
  helium; the v2 eval compares the fine-tuned jury against the frozen v1
  bars; a hydrogen 27B defendant/self-review phase re-runs the v1
  system-level pass criterion on v2. Every quantity SPEC.md defers is
  registered here or in the committed files it points to.

corpus:
  articles: 200 (179 primaries, id family V2-###; 21 reserves, id family R##)
  propositions: 8000 (40 per article)
  split_role: all 200 articles are the test split (no v2 train/cal split)
  window: 2026-02-15..2026-08-27, post-cutoff, verified blind for the 27B
    solver (cutoff-probe batch 4, runs/2026-08-27-batch4-27b, plus P4/P5/
    batch1; cutoff lower bound before 2026-01-03 via P13)
  source: >-
    Wikipedia Current events portal, 8 months (2026-02..2026-08), verbatim
    where available, else drafted from source-level verified facts
    (corpus-v2/topics.md is the authoritative 281-row fact-check record).
  label_totals: {ENTAIL: 4000, CONTRADICT: 2000, UNSPECIFIED: 2000}
  labeler: >-
    single (Andryo Marzuki, disclosed), agent-assisted drafting and
    fact-checking. 281 topic rows: 266 [V] verified, 15 [V*] verified-with-
    noted-caveat, 0 [P] pending. No row failed verification.
  recheck: >-
    10 percent stratified blind recheck: 794/800 raw agreement (99.25
    percent), 6 in-class label replacements. Self-consistency, not
    inter-annotator agreement.
