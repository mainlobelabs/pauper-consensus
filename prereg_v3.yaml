wct_definitions:
  WCT-U: 'signed UNIQUE-SOURCE support: each canonical proposition scores the number of distinct sources
    affirming it minus those denying it, with one observation per (agent, proposition) by construction
    (M6). Frozen implementation: wct3/observe.py build_rows + to_arrays.'
  WCT-EM: 'Dawid-Skene three-state latent-truth aggregation over the same observation matrix, estimating
    per-agent confusion and a per-item latent state; PRIMARY arm. Frozen implementation: wct/aggregate.py.'
  WCT-C: 'the supervised variant: the same observation matrix scored by a classifier fitted on the calibration
    split, so it measures what a supervised reader could extract rather than what the unsupervised aggregate
    does.'
  covariate_baseline: logistic on qdep, n_emitting, n_claims, text_len/50 -- the arm every WCT arm must
    beat to claim proposition-level signal rather than item difficulty.
  single_best_calibration_selected: the best single source CHOSEN ON THE CALIBRATION SPLIT and then evaluated
    on test; the honest comparator, as distinct from an oracle that peeks at test.
m0_simulation_grid:
  artifact: out/m0_ceiling.txt
  sha256: 96550cb80ccdd2e8fa4335bec3fc6cb70a33672151319d8e6dad1a13fa6914f7
  invariant: I8 effective panel size M_eff = M / (1 + (M-1)*rho)
  why_registered: 'the dose-response prediction is about M_eff, not raw M: if inter-source error correlation
    rho is high, adding sources buys little and a flat dose-response is the PREDICTED result rather than
    a refutation of the panel'
  excerpt:
  - ==========================================================================
  - I8  EFFECTIVE PANEL SIZE   M_eff = M / (1 + (M-1)*rho)
  - ==========================================================================
  - '   rho |  M_eff(M=4)  M_eff(M=5)  M_eff(M=8)  cap = 1/rho'
  - '  0.00 |        4.00        5.00        8.00          inf'
  - '  0.05 |        3.48        4.17        5.93        20.00'
  - '  0.10 |        3.08        3.57        4.71        10.00'
  - '  0.20 |        2.50        2.78        3.33         5.00'
  - '  0.30 |        2.11        2.27        2.58         3.33'
  - '  0.40 |        1.82        1.92        2.11         2.50'
  - '  0.50 |        1.60        1.67        1.78         2.00'
  - '  0.70 |        1.29        1.32        1.36         1.43'
arms:
- WCT-EM (primary)
- WCT-U
- WCT-C
- covariate_baseline (the arm every WCT arm must beat)
- single_best_calibration_selected (the registered comparator)
- prevalence_only (constant; no calibration map)
generation:
  cell: cross_family_diverse_role only
  roles:
    schedule: latin_square(cross_family key order, [forward, backward, skeptic], item index)
    prompts: wct/nodes.py build_prompt(item, role), frozen at the v2 tag
    role_set:
    - forward
    - backward
    - skeptic
    note: roles are rotated across families by the Latin square so role is not confounded with vendor
      -- the confound cycle 1 could not rule out because it varied both at once
  seed: 20260807
  temperature: 0.7
  max_tokens: 2000
  scheduling: 'MODEL-MAJOR and strictly before analysis: one model completes its whole pass before the
    next begins; no concurrent model swaps; no embedding or analysis call is issued while generation is
    active, because the local server has a single model slot.'
  failed_calls: never written to the immutable artifact cache
delta:
  value: 0.0448
  units: nats of held-out log loss
  formula: 'min over CONCLUSIVE panel-cycles (decision == ''go'') of the WCT-EM panel_vs_single_best_calibration_selected
    delta_log_loss point estimate, each read under that cycle''s OWN registered calibration map ({''c1_local'':
    ''temperature'', ''c1_openrouter'': ''temperature'', ''c2_panelA'': ''platt'', ''c2_panelB'': ''platt''})'
  argmin: c1_local
  inputs_conclusive:
    c1_local: 0.04481
    c1_openrouter: 0.08866
    c2_panelA: 0.07622
  excluded_inconclusive:
    c2_panelB:
      point: 0.03292
      decision: inconclusive
  n_conclusive: 3
  n_panel_cycles: 4
  artifact: out/v3/reanalysis_<panel-cycle>.json
  immutable_after_results: true
  rationale: cycle 3 must detect at least the smallest effect cycles 1-2 CONCLUSIVELY showed; the mean
    or max would register a threshold the programme has not demonstrated it can meet, and including an
    inconclusive cycle would lower the floor on the strength of a result that did not clear its own decision
    rule
