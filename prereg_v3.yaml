predictions:
  P1_primary:
    claim: the panel aggregate beats the calibration-selected best single source by at least delta=0.0448
      nats at M=5
    supports: lower bound of the paired item-block bootstrap CI > delta
    refutes: upper bound of the CI < delta
    inconclusive: the CI spans delta
  P2_dose_response:
    claim: the margin over the best single source GROWS from M=3 to M=4 to M=5, as error decorrelation
      predicts
    estimand: margin(M=5) - margin(M=3), paired on the items both panels scored
    uncertainty_method: percentile CI from the item-block bootstrap, 2000 resamples, seed 20260807, alpha
      0.05 -- the same method the frozen contrasts use
    decision_variable: the paired increment's CI against the detectable floor
    supports: CI lower bound > detectable floor
    refutes: CI upper bound < detectable floor -- the panel may still beat the best single source while
      ADDING sources buys nothing, which is evidence against the decorrelation premise rather than against
      the panel
    inconclusive: the CI spans the detectable floor
    mutually_exclusive: lower > floor and upper < floor cannot both hold because lower <= upper, so exactly
      one verdict applies. An earlier formulation combined a lower-bound-above-zero test with a monotonicity
      conjunct and could fire SUPPORTS and REFUTES at once for a CI lying wholly between 0 and the floor.
    monotonicity: 'reported for M=3 -> M=4 -> M=5 but NOT part of the verdict: it is a description, not
      a test, and adding it as a conjunct would leave the outcomes non-exhaustive'
    implementation: exp3.run_cycle3.dose_response
    multiplicity: P1 and P2 are the only registered confirmatory tests. Across the three aggregation arms
      (WCT-U, WCT-EM, WCT-C) and two calibration maps, WCT-EM under the registered map is PRIMARY and
      the rest are reported as registered sensitivity, not as additional chances to succeed. No alpha
      is spent on them.
exclusions: items with no decidable proposition; agents returning no parseable claim for an item; observations
  whose alignment score is below T_ALIGN. Exclusion rules are frozen here and applied identically to every
  arm.
panel_membership_rule:
  min_agents_per_item: equal to the panel size M
  why: an item analysed under M=5 must actually carry five sources. A lower threshold would let an 'M=5'
    result rest on two sources for some items, which is exactly the quantity the dose-response varies,
    so the arms would differ by less than their labels claim
  consequence: items where any member produced no parseable claim are dropped from that panel's analysis,
    and the retained item count is reported per M
primary_adjudication:
  map: platt
  map_rationale: cycle 2's registered map, carried forward so cycle 3's primary is comparable with the
    +0.220/+0.272 results on the shared 150-item stratum. The temperature map is reported as registered
    sensitivity, never as a second chance.
  arm: WCT-EM
  delta: the registered delta above, NOT wct3.arms.FROZEN_DELTA
  arms_frozen_delta: 0.02
  why: wct3.arms carries cycle 2's frozen delta of 0.02 and must keep it or slice 1's frozen reproduction
    breaks. Cycle 3 therefore adjudicates in exp3.run_cycle3.primary_verdict against its own registered
    delta; reading arms' `decision` field would register one threshold and apply another
  implementation: exp3.run_cycle3.primary_verdict
