    detectable_at_registered_n: 0.0071
    detectable_at_sd_min: 0.0045
    n: 9805
    note: this is the SMALLEST M=3->M=5 increment the registered n can detect. The primary contrast is
      comfortably powered; the dose-response increment is the binding arm and this is its floor. If the
      true increment is below this, the arm is underpowered and a null is uninterpretable -- stated here
      rather than discovered afterwards.
