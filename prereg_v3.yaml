protocol_version: v3
tag: prereg-v3-2026-08-30
freeze_discipline: This file and the analysis driver are committed and tagged BEFORE any cycle-3 generation
  exists. The implementations ARE the registration.
estimand: The fixed-panel difference in held-out log loss between the panel aggregate and the calibration-selected
  best single source, over the item distribution. Models and roles are fixed experimental levels; uncertainty
  generalises over items.
instrument:
  nli_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  precision: fp32
  device: cuda
  implementation: wct3.gpu.nli_gpu
  change_from_cycles_1_2: 'cycles 1-2 ran fp16, not fp32: the checkpoint config declares dtype=float16
    and transformers honours it on CPU as well as GPU. This is registered as an INSTRUMENT CHANGE.'
  measured_device_dependence:
    cpu_fp32_vs_gpu_fp32:
      max_abs: 7.8e-06
      argmax_flips: 0
    cpu_fp16_vs_gpu_fp16:
      max_abs: 0.0044
      argmax_flips: 1
    cpu_fp16_vs_cpu_fp32:
      max_abs: 0.0038
      argmax_flips: 0
    n_pairs: 800
    conclusion: fp16 is device dependent; fp32 is not. fp32 is registered.
  cache_isolation: 'cycle 3 uses a SEPARATE WCT_CACHE root. fp16-cached and fp32-computed NLI are never
    mixed: the smallest observed alignment margin is 0.0021, exactly 1x the fp16->fp32 score perturbation.'
  fail_closed: a non-dry run aborts if the registered fp32/GPU instrument is unavailable; there is no
    fp16 fallback path
